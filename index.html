<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#8FA088" />
    <title>Hedgehog 语感词库</title>
    <link rel="manifest" href="site.webmanifest" />
    <link rel="icon" href="favicon.ico" sizes="256x256" />
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="icon" href="icons/hedgehog.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 密码门 -->
    <div class="gate" id="gate">
      <div class="gate-card">
        <img class="gate-logo" src="icons/hedgehog.svg" alt="" />
        <h1>Hedgehog</h1>
        <p class="gate-sub">语感词库 · 自用</p>
        <form id="gateForm" autocomplete="off">
          <input
            id="gatePassword"
            type="password"
            placeholder="访问密码"
            autocomplete="current-password"
            required
          />
          <button type="submit" id="gateBtn">进入</button>
        </form>
        <p class="gate-hint" id="gateHint"></p>
      </div>
    </div>

    <!-- 本子 -->
    <div class="app" id="app" hidden>
      <div class="notebook">
        <div class="spiral" aria-hidden="true"></div>
        <div class="page paper-grid" id="page">
          <div class="holes" aria-hidden="true"></div>
          <header class="page-head">
            <a class="brand" href="#/home">
              <img src="icons/hedgehog.svg" alt="" />
              <span><strong>Hedgehog</strong><small>语感词库</small></span>
            </a>
            <div class="page-date" id="pageDate"></div>
            <button class="paper-btn" id="paperBtn" type="button" title="切换纸纹">换纸</button>
          </header>
          <main id="view" class="view"></main>
          <footer class="page-foot"><span class="page-num" id="pageNum">— 1 —</span></footer>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
