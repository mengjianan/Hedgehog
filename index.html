<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#8FA088" />
    <title>Hedgehog 语感词库</title>
    <link rel="manifest" href="site.webmanifest" />
    <link rel="icon" href="favicon.ico" sizes="256x256" />
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="icon" href="icons/hedgehog.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css?v=33" />
  </head>
  <!-- body.booting：启动比对缓存期间密码门不可见（防刷新时一闪而过，见 styles.css） -->
  <body class="booting">
    <!-- 密码门 -->
    <div class="gate" id="gate">
      <div class="gate-card">
        <img class="gate-logo" src="icons/hedgehog.svg" alt="" />
        <h1>Hedgehog</h1>
        <p class="gate-sub">语感词库 · 自用</p>
        <form id="gateForm" autocomplete="off">
          <input
            id="gatePassword"
            type="password"
            placeholder="访问密码"
            autocomplete="current-password"
            required
          />
          <button type="submit" id="gateBtn">进入</button>
        </form>
        <p class="gate-hint" id="gateHint"></p>
      </div>
    </div>

    <!-- 本子 -->
    <div class="app" id="app" hidden>
      <div class="notebook">
        <div class="page paper-grid" id="page">
          <div class="holes" aria-hidden="true"></div>
          <header class="page-head">
            <a class="brand" href="#/home">
              <img src="icons/hedgehog.svg" alt="" />
              <span><strong>Hedgehog</strong><small>语感词库</small></span>
            </a>
            <div class="page-date" id="pageDate"></div>
            <button class="paper-btn" id="paperBtn" type="button" title="切换纸纹">换纸</button>
          </header>
          <main id="view" class="view"></main>
          <footer class="page-foot"><span class="page-num" id="pageNum">— 1 —</span></footer>
        </div>
      </div>
    </div>

    <!-- 悬浮手写板（基础表抄写 / 练习默写共用）：挂 body，不随页面切换销毁 -->
    <div class="fpad" id="fpad" hidden>
      <div class="fpad-bar" id="fpadBar">
        <span class="fpad-title"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.12 2.12 0 0 0-3-3L5 17v3z"/><path d="M14.5 6.5l3 3"/></svg> 手写板</span>
        <span class="fpad-btns">
          <button type="button" id="fpadClear">清一下</button>
          <button type="button" id="fpadClose">收起</button>
        </span>
      </div>
      <div class="fpad-body"><canvas id="fpadCanvas" width="720" height="540"></canvas></div>
      <div class="pad-resize" data-box="fpad" title="上下拖动调节手写板高度"></div>
    </div>

    <script src="app.js?v=33"></script>
  </body>
</html>
