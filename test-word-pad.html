<!doctype html>
<meta charset="utf-8" />
<title>word pad test</title>
<style>
  pre { position: absolute; top: 0; right: 0; width: 300px; margin: 0; padding: 4px;
        font: 10px/1.35 monospace; background: #ffffffe8; z-index: 9; max-height: 100%; overflow: auto; }
  iframe { margin: 0; }
</style>
<pre id="out">boot…</pre>
<script>
/* 词页「手写板」按钮测试：注入假词库绕过密码门，核对按钮位置与悬浮板开关。
   需要本地服务（有 /__hold 更好），跑完清掉假缓存。 */
var LOG = [];
function say(s) { LOG.push(s); document.getElementById('out').textContent = LOG.join('\n'); }
if (/nolog/.test(location.search)) document.getElementById('out').style.display = 'none';
function slp(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

function seed() {
  return fetch('data/words.enc.gz', { method: 'HEAD', cache: 'no-store' }).then(function (r) {
    var t = r.headers.get('ETag') || r.headers.get('Last-Modified') || '';
    if (t) { try { localStorage.setItem('hedgehog:etag', t); } catch (e) {} }
    say('etag: ' + t);
    var fake = {
      version: 7,
      tables: [{ id: 't0', title: '空表', lang: 'en', sections: [] }],
      lists: [{
        id: 'lt', title: '测试厅', lang: 'en', words: [
          { w: 'apple', pron: '/ˈæpl/', pos: 'n.', zh: '苹果', sense: '一种水果',
            trap: '别和 application 混', collo: ['an apple a day', 'apple pie'],
            ex: [{ en: 'I ate an apple.', zh: '我吃了一个苹果。' }] },
          { w: 'pear', pron: '/peə/', pos: 'n.', zh: '梨', sense: '一种水果',
            trap: '形近 pea', collo: ['a pear'], ex: [{ en: 'A pear.', zh: '一个梨。' }] },
        ],
      }],
      tags: {},
    };
    try { localStorage.setItem('hedgehog:data', JSON.stringify(fake)); } catch (e) { say('seed fail ' + e); }
  });
}

function waitFor(fn, ms) {
  var t0 = Date.now();
  return new Promise(function (res, rej) {
    (function loop() {
      var v = null;
      try { v = fn(); } catch (e) {}
      if (v) return res(v);
      if (Date.now() - t0 > (ms || 10000)) return rej(new Error('timeout'));
      setTimeout(loop, 60);
    })();
  });
}

(async function () {
  try {
    var keep = setInterval(function () { fetch('/__hold?ms=150').catch(function () {}); }, 20);
    fetch('/__hold?ms=150').catch(function () {});
    await slp(30);
    await seed();

    var fr = document.createElement('iframe');
    fr.style.cssText = 'width:390px;height:844px;border:0;display:block';
    fr.src = 'index.html#/word/lt/apple';
    document.body.appendChild(fr);

    var D = null;
    try {
      D = await waitFor(function () {
        var dd = fr.contentDocument;
        return dd && dd.querySelector('.word-head h2');
      }, 15000);
    } catch (e0) {
      var dd0 = fr.contentDocument;
      say('iframe 未就绪: ready=' + (dd0 && dd0.readyState));
      if (dd0) {
        say('app.hidden=' + dd0.getElementById('app').hidden + ' gate.hidden=' + dd0.getElementById('gate').hidden);
        say('view=' + (dd0.getElementById('view').textContent || '').slice(0, 160));
      }
      throw e0;
    }
    await slp(250);
    var w = fr.contentWindow;
    D = fr.contentDocument;

    say('词头: ' + D.querySelector('.word-head h2').textContent);
    say('旧内嵌板 #wmCanvas: ' + (D.querySelector('#wmCanvas') ? '还在 ✘' : '已撤 ✔'));
    say('页面出现「书写练习」: ' + (/书写练习/.test(D.querySelector('#view').textContent) ? '是 ✘' : '否 ✔'));

    var btn = D.querySelector('.table-actions button[data-act="fpad-toggle"]');
    say('按钮: ' + (btn ? '「' + btn.textContent.trim() + '」' : '缺失 ✘'));
    if (btn && btn.textContent.indexOf('手写板') < 0) say('  按钮文字不对 ✘');
    var firstSec = D.querySelector('.entry-section');
    var br = btn && btn.getBoundingClientRect();
    var sr = firstSec && firstSec.getBoundingClientRect();
    say('位置: 按钮 top=' + Math.round(br ? br.top : -1) + ' · 首个分区 top=' + Math.round(sr ? sr.top : -1) +
      ' → ' + (br && sr && br.top < sr.top ? '在上边 ✔' : '不在上边 ✘'));

    var fpad = D.getElementById('fpad');
    say('点击前 #fpad hidden: ' + fpad.hidden);
    btn.click();
    await slp(200);
    say('点击后 #fpad hidden: ' + fpad.hidden + (fpad.hidden ? ' ✘' : ' ✔'));
    say('板内有画布/清一下/收起: ' + (D.getElementById('fpadCanvas') ? '有' : '无') + '/' +
      (D.getElementById('fpadClear') ? '有' : '无') + '/' + (D.getElementById('fpadClose') ? '有' : '无'));
    var fpr = fpad.getBoundingClientRect();
    say('板位置: [' + Math.round(fpr.left) + ',' + Math.round(fpr.top) + '] ' +
      Math.round(fpr.width) + 'x' + Math.round(fpr.height) + ' 可见=' + (fpr.width > 0 && fpr.height > 0));

    D.getElementById('fpadClose').click();
    await slp(120);
    say('收起后 #fpad hidden: ' + fpad.hidden + (fpad.hidden ? ' ✔' : ' ✘'));

    var de = D.documentElement;
    say('横向溢出: ' + (de.scrollWidth > de.clientWidth ? 'YES ' + de.scrollWidth + '>' + de.clientWidth : 'no'));

    if (/shot/.test(location.search)) {
      btn.click();
      await slp(250);
      fr.contentWindow.scrollTo(0, 0);
    }

    say('DONE');
    clearInterval(keep);
    try {
      localStorage.removeItem('hedgehog:data');
      localStorage.removeItem('hedgehog:etag');
      var rq2 = indexedDB.open('hedgehog', 1);
      rq2.onsuccess = function () {
        var tx2 = rq2.result.transaction('kv', 'readwrite');
        tx2.objectStore('kv').delete('data');
      };
    } catch (e) {}
  } catch (e) {
    say('ERROR: ' + (e && e.stack || e));
  }
})();
</script>
