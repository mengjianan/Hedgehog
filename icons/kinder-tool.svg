    <path d="M14 84 H146" stroke="#C9BFAE"/>
    <!-- 锤子 -->
    <rect x="26" y="26" width="34" height="16" rx="4" transform="rotate(18 43 34)"/>
    <path d="M52 44 L94 78" stroke-width="2.6"/>
    <path d="M80 68 l9 7 M85 64 l9 7" stroke="#A8B5A2"/>
