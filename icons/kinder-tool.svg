    <circle cx="120" cy="36" r="6"/>
    <path d="M114 48 L90 76" stroke-width="2.6"/>
    <!-- 螺丝 -->
    <path d="M118 66 v14" stroke-width="2.2"/>
    <path d="M120 73 h20" stroke-width="2.2"/>
    <path d="M126 69 l3 8 M133 69 l3 8" stroke="#A8B5A2"/>
