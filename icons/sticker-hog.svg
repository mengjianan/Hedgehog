    <path d="M118 62 Q122 65 126 62" fill="none" stroke-width="2.4"/>
    <!-- 小脚 -->
    <path d="M40 72 q-2 8 8 8" fill="none"/>
    <path d="M84 73 q-2 8 8 8" fill="none"/>
    <!-- 头顶小花 -->
    <path d="M66 18 q2 -8 8 -8 q6 0 6 7 q0 6 -7 6" fill="#c0392b" stroke-width="2.4"/>
    <path d="M74 17 l2 4" fill="none" stroke-width="2.4"/>
