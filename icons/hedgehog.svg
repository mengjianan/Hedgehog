      <path d="M16 36 L8 28"/><path d="M22 29 L17 18"/><path d="M30 25 L28 13"/>
      <path d="M38 25 L40 13"/><path d="M46 29 L52 19"/><path d="M51 36 L59 30"/>
    </g>
