    <circle cx="40" cy="38" r="2.4" fill="#4A443C"/>
    <circle cx="55" cy="44" r="2.9" fill="#4A443C"/>
    <path d="M47 47 Q50 49.5 53 47" stroke="#4A443C" stroke-width="1.7" fill="none"/>
